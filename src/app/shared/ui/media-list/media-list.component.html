<div class="media-list">
    @if (state.state === 'loading') {
        <ng-container *ngTemplateOutlet="skeleton" />
    } @else if (state.state === 'success' || state.state === 'loading-more') {
        @for (entry of state.data; track entry.item.id; let position = $index) {
            <app-media-list-item
                [item]="entry.item"
                [genreNames]="entry.genreNames"
                [link]="entry.routerLink"
                [index]="showIndex ? position + 1 : null"
            />
        }
        @if (state.state === 'loading-more') {
            <ng-container *ngTemplateOutlet="skeleton" />
        }
    }
</div>

<ng-template #skeleton>
    @for (i of skeletonCount | repeat; track i) {
        <app-media-list-item [loading]="true" [index]="showIndex ? i + 1 : null" />
    }
</ng-template>
