@if (loading) {
    <div class="person-card" aria-hidden="true">
        <div class="person-card__photo">
            <app-skeleton class="person-card__photo-fill" />
        </div>

        <app-skeleton class="person-card__name person-card__name--skeleton text-card-title" />
        <app-skeleton class="person-card__subtitle--skeleton text-card-meta" />
    </div>
} @else if (person; as person) {
    <a class="person-card" [routerLink]="['/name', person.id]">
        <app-image
            class="person-card__photo"
            [src]="person.imagePath"
            type="person"
            [alt]="person.name"
            [name]="person.name"
            params="w185"
        />

        <span class="person-card__body" [class.person-card__body--ranked]="rank">
            @if (rank) {
                <span class="person-card__rank text-numeral" aria-hidden="true">{{ rank }}</span>
            }

            <span class="person-card__text">
                <span class="person-card__name text-card-title">{{ person.name }}</span>

                <span class="person-card__subtitle text-card-meta">
                    @if (person.subtitle) {
                        {{ person.subtitle }}
                    } @else {
                        unknown
                    }
                </span>
            </span>
        </span>
    </a>
}
