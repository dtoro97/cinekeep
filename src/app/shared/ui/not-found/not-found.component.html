<div class="page-container">
    <div class="not-found inner-container" aria-labelledby="not-found-title">
        <div class="not-found__message">
            <p class="not-found__mark" aria-hidden="true">404</p>
            <h1 id="not-found-title" class="not-found__title text-display">Page not found</h1>
            <p class="not-found__text text-body">
                The link may be broken, or the title may have been removed from TMDb. Try a search, or start from one
                of these.
            </p>
        </div>

        <nav class="not-found__links" aria-label="Suggested pages">
            @for (link of links; track link.label) {
                <a class="not-found__link" [routerLink]="link.route">
                    {{ link.label }}
                    <span class="not-found__section">{{ link.section }} ›</span>
                </a>
            }
        </nav>
    </div>
</div>
