<article class="video-card">
    @if (item.href) {
        <a
            class="video-card__media"
            [href]="item.href"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="item.openLabel"
        >
            <ng-container *ngTemplateOutlet="thumbnail" />
        </a>
    } @else {
        <div class="video-card__media" aria-hidden="true">
            <ng-container *ngTemplateOutlet="thumbnail" />
        </div>
    }

    <div class="video-card__body">
        @if (headingLink) {
            <a class="video-card__title text-card-title" [routerLink]="headingLink">{{ heading }}</a>
        } @else {
            <p class="video-card__title text-card-title">{{ heading }}</p>
        }

        @if (showMetadata) {
            <p class="video-card__metadata text-card-meta">
                @if (typeLabel) {
                    <span>{{ typeLabel }}</span>
                }
                @if (videoName) {
                    <span class="video-card__video-name">{{ videoName }}</span>
                }
                @if (item.publishedAt) {
                    <span>{{ item.publishedAt | date: 'mediumDate' }}</span>
                }
            </p>
        }
    </div>
</article>

<ng-template #thumbnail>
    <div class="video-card__thumb aspect-landscape">
        <img
            class="video-card__image"
            [src]="thumbnailSrc"
            [alt]="item.alt"
            (load)="checkThumbnail($event)"
            (error)="useNextThumbnail()"
        />

        <div class="video-card__play" aria-hidden="true">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
        </div>
    </div>
</ng-template>
