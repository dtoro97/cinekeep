@if (hasOptions) {
    <div class="toggle-group" [class.toggle-group--chips]="showChips" role="group" [attr.aria-label]="ariaLabel">
        @for (option of viewOptions; track option.value) {
            <button
                type="button"
                class="toggle-group__button text-meta"
                [attr.aria-pressed]="option.isSelected"
                [class.toggle-group__button--active]="option.isSelected"
                (click)="toggle(option.value)"
            >
                {{ option.label }}
                @if (option.hasCount) {
                    <span class="toggle-group__count">{{ option.count }}</span>
                }
            </button>
        }
    </div>
}
