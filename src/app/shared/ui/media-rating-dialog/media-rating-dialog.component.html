<div class="media-rating-dialog">
    <header class="media-rating-dialog__header">
        <h2 class="text-display-sm">Rate {{ title }}</h2>
        @if (!isAuthenticated) {
            <p class="text-body-sm">Sign in to save ratings to your CineKeep account.</p>
        }
    </header>

    <div class="media-rating-dialog__content" mat-dialog-content>
        <div class="media-rating-dialog__score">
            <span class="text-rating-yours">
                {{ value | number: '1.1-1' }}
            </span>
            <span class="text-caption">/ 10</span>
        </div>

        <mat-slider class="media-rating-dialog__slider" [min]="0.5" [max]="10" [step]="0.5" discrete>
            <input matSliderThumb [ngModel]="value" (ngModelChange)="updateValue($event)" />
        </mat-slider>
    </div>

    @if (!isAuthenticated) {
        <div class="media-rating-dialog__actions" mat-dialog-actions>
            <div class="media-rating-dialog__primary-actions">
                <button matButton class="text-button" type="button" mat-dialog-close>Cancel</button>
                <button matButton="filled" type="button" (click)="loginToSave()">Sign in to rate</button>
            </div>
        </div>
    } @else {
        <div class="media-rating-dialog__actions" mat-dialog-actions>
            @if (hasCurrentRating) {
                <button class="media-rating-dialog__remove" type="button" (click)="removeRating()">
                    Remove rating
                </button>
            }

            <div class="media-rating-dialog__primary-actions">
                <button matButton class="text-button" type="button" mat-dialog-close>Cancel</button>
                <button matButton="filled" type="button" (click)="save()">
                    {{ saveLabel }}
                </button>
            </div>
        </div>
    }
</div>
