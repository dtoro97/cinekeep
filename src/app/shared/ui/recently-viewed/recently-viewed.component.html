@if (recentlyViewed$ | async; as recentlyViewed) {
    @if (recentlyViewed.hasItems) {
        <section class="recently-viewed" aria-labelledby="recently-viewed-title">
            <div class="recently-viewed__header">
                <h2 id="recently-viewed-title" class="recently-viewed__title text-section-label">Recently viewed</h2>

                <button class="recently-viewed__clear text-body-sm" type="button" (click)="clearAll()">
                    Clear all
                </button>
            </div>

            <app-carousel ariaLabel="Recently viewed titles and people" [columns]="6" [items]="recentlyViewed.items">
                <ng-template let-item>
                    @if (item.kind === 'person') {
                        <app-person-card [person]="item" />
                    } @else {
                        <app-card [item]="item" [showRating]="false" />
                    }
                </ng-template>
            </app-carousel>
        </section>
    }
}
