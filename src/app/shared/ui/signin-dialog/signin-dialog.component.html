@if (signinDialog$ | async; as signinDialog) {
    <section class="signin-dialog">
        <header class="signin-dialog__header">
            <h2 class="text-display-sm">{{ signinDialog.title }}</h2>
            <p class="text-body-sm signin-dialog__description">{{ signinDialog.description }}</p>
        </header>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <mat-dialog-content class="signin-dialog__content">
                <label class="signin-dialog__field">
                    <span class="text-body-sm">Email</span>
                    <mat-form-field appearance="outline" subscriptSizing="dynamic">
                        <input matInput type="email" formControlName="email" autocomplete="email" />
                        @if (signinDialog.showEmailRequired) {
                            <mat-error>Enter your email.</mat-error>
                        } @else if (signinDialog.showEmailInvalid) {
                            <mat-error>Enter a valid email address.</mat-error>
                        }
                    </mat-form-field>
                </label>

                @if (signinDialog.isRegister) {
                    <label class="signin-dialog__field">
                        <span class="text-body-sm">Username</span>
                        <mat-form-field appearance="outline" subscriptSizing="dynamic">
                            <input
                                matInput
                                type="text"
                                formControlName="username"
                                autocomplete="username"
                                [maxlength]="usernameMaxLength"
                            />
                            @if (signinDialog.showUsernameRequired) {
                                <mat-error>Choose a username.</mat-error>
                            }
                        </mat-form-field>
                    </label>
                }

                <label class="signin-dialog__field">
                    <span class="text-body-sm">Password</span>
                    <mat-form-field appearance="outline" subscriptSizing="dynamic">
                        <input
                            matInput
                            type="password"
                            formControlName="password"
                            [attr.autocomplete]="signinDialog.passwordAutocomplete"
                        />
                        @if (signinDialog.showPasswordRequired) {
                            <mat-error>Enter your password.</mat-error>
                        }
                    </mat-form-field>
                </label>

                @if (signinDialog.errorMessage; as message) {
                    <p class="signin-dialog__error text-body-sm" role="alert">{{ message }}</p>
                }

                <p class="signin-dialog__switch text-body-sm">
                    @if (signinDialog.isRegister) {
                        Already have an account?
                    } @else {
                        New to CineKeep?
                    }
                    <button class="signin-dialog__switch-button" type="button" (click)="toggleMode()">
                        @if (signinDialog.isRegister) {
                            Sign in
                        } @else {
                            Create an account
                        }
                    </button>
                </p>
            </mat-dialog-content>

            <mat-dialog-actions align="end">
                <button matButton class="text-button" type="button" (click)="cancel()">Cancel</button>
                <button
                    matButton="filled"
                    type="submit"
                    [disabled]="signinDialog.isPending"
                    [attr.aria-busy]="signinDialog.isPending"
                >
                    {{ signinDialog.submitLabel }}
                </button>
            </mat-dialog-actions>
        </form>
    </section>
}
