<div class="empty-state">
    @if (iconStyle === 'posters') {
        <span class="empty-state__posters" aria-hidden="true">
            <span class="empty-state__poster"></span>
            <span class="empty-state__poster"></span>
            <span class="empty-state__poster"></span>
        </span>
    } @else {
        <span
            class="empty-state__icon-shell"
            [class.empty-state__icon-shell--plain]="iconStyle === 'plain'"
            aria-hidden="true"
        >
            <i class="empty-state__icon {{ iconClass }}"></i>
        </span>
    }

    <div class="empty-state__content">
        @if (title) {
            <p class="empty-state__title text-title">{{ title }}</p>
        }

        <p class="empty-state__text text-body-sm">{{ text }}</p>
    </div>

    <ng-content />
</div>
