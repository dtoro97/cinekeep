@if (account$ | async; as account) {
    @if (!account.isReady) {
        <button class="account-menu__placeholder" type="button" disabled aria-label="Account menu loading">
            <mat-icon class="account-menu__placeholder-icon" aria-hidden="true">account_circle</mat-icon>
        </button>
    } @else if (account.isAuthenticated) {
        <button
            class="account-menu__trigger"
            type="button"
            [matMenuTriggerFor]="accountMenu"
            [matMenuTriggerRestoreFocus]="false"
            [disabled]="account.isBusy"
            attr.aria-label="Open account menu for {{ account.displayName }}"
            (menuOpened)="loadCounts()"
        >
            <app-user-avatar class="account-menu__avatar" [name]="account.avatarName" size="sm" />
            <mat-icon class="account-menu__chevron" aria-hidden="true">expand_more</mat-icon>
        </button>

        <mat-menu #accountMenu="matMenu" xPosition="before" class="menu-panel--wide">
            <div class="account-menu__panel">
                <a class="account-menu__identity" mat-menu-item routerLink="/me">
                    <span class="account-menu__identity-row">
                        <app-user-avatar class="account-menu__identity-avatar" [name]="account.avatarName" size="sm" />
                        <span class="account-menu__identity-copy">
                            <span class="account-menu__identity-name u-truncate">{{ account.displayName }}</span>
                            <span class="account-menu__identity-link">View profile</span>
                        </span>
                    </span>
                </a>

                <div class="account-menu__separator" role="separator"></div>

                <nav aria-label="Library">
                    @for (item of account.libraryItems; track item.route) {
                        <a class="account-menu__item" mat-menu-item [routerLink]="item.route">
                            <span class="account-menu__item-row">
                                <span>{{ item.label }}</span>
                                @if (item.count !== null) {
                                    <span class="account-menu__count">{{ item.count }}</span>
                                }
                            </span>
                        </a>
                    }
                </nav>

                <div class="account-menu__separator" role="separator"></div>

                <button
                    class="account-menu__item"
                    mat-menu-item
                    type="button"
                    [disabled]="account.isBusy"
                    (click)="signOut()"
                >
                    Sign out
                </button>
            </div>
        </mat-menu>
    } @else {
        <button
            class="account-menu__signin"
            type="button"
            [disabled]="account.isBusy"
            [attr.aria-busy]="account.isBusy"
            (click)="startLogin()"
        >
            <span>Sign in</span>
        </button>
    }
}
