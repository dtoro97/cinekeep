@if (searchBar$ | async; as searchBar) {
    <div
        class="header-search"
        role="search"
        [class.header-search--open]="searchBar.searchOpen"
        [cdkTrapFocus]="searchBar.searchOpen"
        [cdkTrapFocusAutoCapture]="searchBar.searchOpen"
        (focusout)="onFocusOut($event)"
    >
        <div class="header-search__top">
            <button class="header-search__back" type="button" aria-label="Close search" (click)="closeSearch()">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>

            <div class="header-search__bar">
                <mat-form-field
                    class="header-search__filter-field mat-mdc-form-field--borderless"
                    appearance="outline"
                    subscriptSizing="dynamic"
                >
                    <mat-select
                        class="header-search__filter-select"
                        aria-label="Search in"
                        [value]="searchBar.searchFilter"
                        (selectionChange)="setFilter($event.value)"
                    >
                        @for (opt of filterOptions; track opt.value) {
                            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-icon class="header-search__search-icon" aria-hidden="true">search</mat-icon>

                <input
                    #searchInput
                    class="header-search__input"
                    type="text"
                    role="combobox"
                    autocomplete="off"
                    spellcheck="false"
                    enterkeyhint="search"
                    aria-label="Search titles and people"
                    aria-autocomplete="list"
                    cdkFocusInitial
                    [attr.aria-expanded]="searchBar.showListbox"
                    [attr.aria-controls]="searchBar.ariaControls"
                    [attr.aria-activedescendant]="searchBar.activeOptionId"
                    [placeholder]="searchBar.placeholder"
                    [formControl]="searchControl"
                    (focus)="openPanel()"
                    (click)="openPanel()"
                    (keydown)="onInputKeydown($event)"
                />

                @if (searchBar.hasQuery) {
                    <button
                        class="header-search__clear"
                        type="button"
                        aria-label="Clear search"
                        (click)="clearSearch()"
                    >
                        <mat-icon aria-hidden="true">close</mat-icon>
                    </button>
                } @else {
                    <kbd class="header-search__shortcut" title="Press / to search" aria-hidden="true">/</kbd>
                }
            </div>
        </div>

        @if (searchBar.searchOpen) {
            <app-toggle-group
                class="header-search__scope-row"
                [options]="filterOptions"
                [selectedValue]="searchBar.searchFilter"
                (selected)="setFilter($event)"
            />
        }

        @if (searchBar.panel.kind !== 'hidden') {
            <div
                class="header-search__dropdown"
                [class.header-search__dropdown--wide]="searchBar.isWidePanel"
                (mousedown)="$event.preventDefault()"
            >
                <app-header-search-results
                    [panel]="searchBar.panel"
                    [listboxId]="searchBar.listboxId"
                    [activeOptionId]="searchBar.activeOptionId"
                    (optionSelected)="closePanel()"
                    (clearRecent)="clearRecent()"
                    (retry)="retry()"
                    (widen)="widenSearch()"
                />
            </div>
        }

        <span class="header-search__status" role="status" aria-live="polite">{{ searchBar.statusMessage }}</span>
    </div>

    <button
        mat-icon-button
        class="header-search__toggle-button"
        type="button"
        aria-label="Search"
        (click)="toggleSearch()"
    >
        <mat-icon>search</mat-icon>
    </button>
}
