@if (vm$ | async; as vm) {
    <div
        class="header-search"
        role="search"
        [class.header-search--open]="vm.searchOpen"
        [cdkTrapFocus]="vm.searchOpen"
        [cdkTrapFocusAutoCapture]="vm.searchOpen"
        (focusout)="onFocusOut($event)"
    >
        <div class="header-search__top">
            <div class="header-search__bar">
                <mat-form-field
                    class="header-search__filter-field mat-mdc-form-field--borderless"
                    appearance="outline"
                    subscriptSizing="dynamic"
                >
                    <mat-select
                        class="header-search__filter-select"
                        aria-label="Search in"
                        [value]="vm.searchFilter"
                        (selectionChange)="setFilter($event.value)"
                    >
                        @for (opt of filterOptions; track opt.value) {
                            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-icon class="header-search__search-icon" aria-hidden="true">search</mat-icon>

                <input
                    #searchInput
                    class="header-search__input"
                    type="text"
                    role="combobox"
                    autocomplete="off"
                    spellcheck="false"
                    enterkeyhint="search"
                    aria-label="Search titles and people"
                    aria-autocomplete="list"
                    cdkFocusInitial
                    [attr.aria-expanded]="vm.listboxVisible"
                    [attr.aria-controls]="vm.listboxVisible ? listboxId : null"
                    [attr.aria-activedescendant]="vm.activeOptionId"
                    [placeholder]="vm.placeholder"
                    [formControl]="searchControl"
                    (focus)="openPanel()"
                    (click)="openPanel()"
                    (keydown)="onInputKeydown($event)"
                />

                @if (vm.hasQuery) {
                    <button class="header-search__clear" type="button" aria-label="Clear search" (click)="clearSearch()">
                        <mat-icon aria-hidden="true">close</mat-icon>
                    </button>
                } @else {
                    <kbd class="header-search__shortcut" title="Press / to search" aria-hidden="true">/</kbd>
                }
            </div>

            <button class="header-search__cancel" type="button" (click)="closeSearch()">Cancel</button>
        </div>

        @if (vm.panel.kind !== "hidden") {
            <div class="header-search__dropdown" (mousedown)="$event.preventDefault()">
                <app-header-search-results
                    [panel]="vm.panel"
                    [listboxId]="listboxId"
                    [activeOptionId]="vm.activeOptionId"
                    (optionSelected)="closePanel()"
                    (retry)="retry()"
                    (widen)="widenSearch()"
                />
            </div>
        }

        <span class="header-search__status" role="status" aria-live="polite">{{ vm.statusMessage }}</span>
    </div>

    <button
        mat-icon-button
        class="header-search__toggle-button"
        type="button"
        aria-label="Search"
        (click)="toggleSearch()"
    >
        <mat-icon>search</mat-icon>
    </button>
}
