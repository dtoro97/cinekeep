<section class="invite" aria-labelledby="home-account-invite">
    <h2 id="home-account-invite" class="invite__title text-display">Keep a diary of what you watch</h2>

    <div class="invite__body">
        <p class="invite__text text-body">
            A free CineKeep account holds your watchlist, your ratings for films and single episodes, and the lists
            you put together.
        </p>
        <button matButton="outlined" type="button" class="invite__action" (click)="openSignin()">
            Sign in or create an account
        </button>
    </div>
</section>
