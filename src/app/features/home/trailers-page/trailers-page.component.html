@if (trailers$ | async; as trailers) {
    <div class="page-container">
        @if (trailers.featured; as featured) {
            <app-hero-spotlight backLink="/" backLabel="Home" [spotlight]="featured.spotlight">
                <a
                    matButton="filled"
                    class="hero-action"
                    [href]="featured.href"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fa-solid fa-play" aria-hidden="true"></i>
                    Play trailer
                </a>
            </app-hero-spotlight>
        } @else {
            <app-hero-spotlight [loading]="true" />
        }

        <div class="page-main">
            <app-page-section title="Trailers">
                <app-toggle-group
                    section-controls
                    [options]="trailers.feedOptions"
                    [selectedValue]="trailers.feedType"
                    (selected)="setFeedType($event)"
                />

                <ul class="trailers">
                    @for (trailer of trailers.trailers; track trailer.id) {
                        <li>
                            <app-video-card [item]="trailer" />
                        </li>
                    }

                    @for (slot of trailers.skeletonCount | repeat; track slot) {
                        <li class="thumb" aria-hidden="true">
                            <app-skeleton class="thumb__art aspect-landscape" />
                            <app-skeleton class="thumb__line thumb__line--title" />
                            <app-skeleton class="thumb__line thumb__line--meta" />
                        </li>
                    }
                </ul>

                @if (trailers.showMore) {
                    <div class="trailers-more">
                        <button
                            mat-stroked-button
                            type="button"
                            [disabled]="trailers.isLoadingMore"
                            (click)="loadMore()"
                        >
                            {{ trailers.showMoreLabel }}
                        </button>
                    </div>
                }
            </app-page-section>
        </div>
    </div>
}
