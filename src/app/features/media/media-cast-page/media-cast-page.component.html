<div class="page-container">
    @if (castCrew$ | async; as castCrew) {
        <app-sub-page-header
            [backdropPath]="castCrew.media?.backdropPath"
            [parentTitle]="castCrew.media?.title"
            [backLink]="['../']"
            pageTitle="Cast & Crew"
            [loading]="castCrew.isMediaLoading"
        />

        <main class="page-main cast-page">
            @if (castCrew.isEmpty) {
                <app-empty-state
                    class="cast-page__empty"
                    iconClass="fa-solid fa-users"
                    iconStyle="plain"
                    text="No cast or crew information is available for this title."
                />
            } @else {
                <app-browse-toolbar class="cast-page__toolbar">
                    @if (castCrew.showLoading) {
                        <app-skeleton start class="cast-page__toggle-skeleton" />
                    } @else {
                        <app-toggle-group
                            start
                            [options]="castCrew.sectionOptions"
                            [selectedValue]="castCrew.section"
                            (selected)="setSection($event)"
                        />
                    }

                    <mat-form-field end class="cast-page__filter" appearance="outline" subscriptSizing="dynamic">
                        <mat-icon matPrefix aria-hidden="true">search</mat-icon>
                        <input
                            matInput
                            type="search"
                            autocomplete="off"
                            placeholder="Filter by name or role"
                            aria-label="Filter cast and crew by name or role"
                            [value]="castCrew.query"
                            (input)="setQuery($event)"
                        />
                    </mat-form-field>
                </app-browse-toolbar>

                @if (castCrew.showDepartments) {
                    <nav class="cast-page__departments" aria-label="Crew departments">
                        <app-toggle-group
                            variant="chips"
                            [options]="castCrew.departmentOptions"
                            [selectedValue]="castCrew.department"
                            (selected)="setDepartment($event)"
                        />
                    </nav>
                }

                @if (castCrew.noMatchesText; as noMatchesText) {
                    <div class="cast-page__no-matches">
                        <app-empty-state
                            iconClass="fa-solid fa-magnifying-glass"
                            iconStyle="plain"
                            [text]="noMatchesText"
                        />
                        <button matButton class="text-button" type="button" (click)="clearQuery()">Clear filter</button>
                    </div>
                } @else {
                    <app-cast-crew-grid
                        [cast]="castCrew.cast"
                        [departments]="castCrew.departments"
                        [showCast]="castCrew.showCast"
                        [loading]="castCrew.showLoading"
                    />
                }
            }
        </main>
    }
</div>
