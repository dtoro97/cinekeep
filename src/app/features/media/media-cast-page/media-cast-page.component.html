<div class="page-container">
    @if (vm$ | async; as vm) {
        <app-sub-page-header
            [backdropPath]="vm.media?.backdropPath"
            [parentTitle]="vm.media?.title"
            [backLink]="['../']"
            pageTitle="Cast & Crew"
            [loading]="!vm.media"
        />

        <main class="page-main cast-page">
            @if (vm.isEmpty) {
                <app-empty-state
                    class="cast-page__empty"
                    iconClass="fa-solid fa-users"
                    iconStyle="plain"
                    text="No cast or crew information is available for this title."
                />
            } @else {
                <app-browse-toolbar class="cast-page__toolbar">
                    @if (vm.isLoading) {
                        <app-skeleton start class="cast-page__toggle-skeleton" />
                    } @else {
                        <app-toggle-group
                            start
                            [options]="vm.sectionOptions"
                            [selectedValue]="vm.section"
                            (selected)="onSectionChange($event)"
                        />
                    }

                    <mat-form-field end class="cast-page__filter" appearance="outline" subscriptSizing="dynamic">
                        <mat-icon matPrefix aria-hidden="true">search</mat-icon>
                        <input
                            matInput
                            type="search"
                            autocomplete="off"
                            placeholder="Filter by name or role"
                            aria-label="Filter cast and crew by name or role"
                            [value]="vm.query"
                            (input)="onQueryInput($event)"
                        />
                    </mat-form-field>
                </app-browse-toolbar>

                @if (vm.showDepartments) {
                    <nav class="cast-page__departments" aria-label="Crew departments">
                        <app-toggle-group
                            variant="chips"
                            [options]="vm.departmentOptions"
                            [selectedValue]="vm.department"
                            (selected)="onDepartmentChange($event)"
                        />
                    </nav>
                }

                @if (vm.noMatchesText; as noMatchesText) {
                    <div class="cast-page__no-matches">
                        <app-empty-state iconClass="fa-solid fa-magnifying-glass" iconStyle="plain" [text]="noMatchesText" />
                        <button matButton class="text-button" type="button" (click)="clearQuery()">Clear filter</button>
                    </div>
                } @else {
                    <app-cast-crew-grid
                        [cast]="vm.cast"
                        [departments]="vm.departments"
                        [showCast]="vm.showCast"
                        [loading]="vm.isLoading"
                    />
                }
            }
        </main>
    }
</div>
