<div class="page-container">
    @if (seasonPhotos$ | async; as seasonPhotos) {
        <div class="catalogue-sub-page inner-container">
            <app-catalogue-sub-header
                pageTitle="Photos"
                [count]="seasonPhotos.images?.length || null"
                [parentTitle]="seasonPhotos.seriesTitle"
                [parentDetail]="seasonPhotos.seasonLabel"
                [backLink]="seasonPhotos.backLink"
                [imagePath]="seasonPhotos.posterPath"
                [loading]="seasonPhotos.isMediaLoading"
            />

            <div class="catalogue-sub-page__body">
                @if (seasonPhotos.showSkeleton) {
                    <app-photos-browser-skeleton />
                } @else if (seasonPhotos.images; as images) {
                    <app-photos-browser [images]="images" (photoSelect)="openPhotoViewer($event)" />
                }
            </div>
        </div>
    }
</div>
