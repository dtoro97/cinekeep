<div class="page-container">
    @if (mediaPhotos$ | async; as mediaPhotos) {
        <div class="catalogue-sub-page inner-container">
            <app-catalogue-sub-header
                pageTitle="Photos"
                [count]="mediaPhotos.images?.length || null"
                [parentTitle]="mediaPhotos.media?.title"
                [parentDetail]="mediaPhotos.media?.year"
                [backLink]="['../']"
                [imagePath]="mediaPhotos.media?.posterPath"
                [loading]="!mediaPhotos.media"
            />

            <div class="catalogue-sub-page__body">
                @if (mediaPhotos.images; as images) {
                    <app-photos-browser [images]="images" (photoSelect)="openPhotoViewer($event)" />
                } @else if (mediaPhotos.showSkeleton) {
                    <app-photos-browser-skeleton />
                }
            </div>
        </div>
    }
</div>
