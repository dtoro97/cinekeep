<button
    class="user-rating"
    type="button"
    [class.user-rating--rated]="hasRating"
    [class.user-rating--pending]="pending"
    [disabled]="disabled"
    [attr.aria-busy]="ariaBusy"
    (click)="ratingClick.emit()"
>
    <span class="user-rating__label text-meta">Your rating</span>

    @if (loading) {
        <app-skeleton class="user-rating__skeleton" aria-hidden="true" />
    } @else if (hasRating) {
        <span class="user-rating__summary">
            <span class="user-rating__value text-rating-yours">{{ currentRating | number: '1.0-1' }}</span>
            <span class="user-rating__scale text-meta">/10</span>
        </span>
    } @else {
        <span class="user-rating__summary user-rating__summary--empty">
            <i class="user-rating__icon fa-regular fa-star" aria-hidden="true"></i>
            <span class="text-title">Rate</span>
        </span>
    }
</button>
