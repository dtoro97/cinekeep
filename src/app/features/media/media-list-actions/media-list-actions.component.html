@if (vm$ | async; as vm) {
    <div class="actions">
        <button
            matButton="filled"
            type="button"
            class="watchlist-button"
            [class.watchlist-button--active]="vm.isInWatchlist"
            [disabled]="vm.pending"
            [attr.aria-pressed]="vm.isInWatchlist"
            (click)="toggleWatchlist()"
        >
            <i
                [class.fa-solid]="vm.isInWatchlist"
                [class.fa-regular]="!vm.isInWatchlist"
                class="fa-bookmark"
                aria-hidden="true"
            ></i>
            {{ vm.watchlistLabel }}
        </button>

        <ng-content />

        <app-icon-button
            class="action"
            [selected]="vm.isFavorite"
            [disabled]="vm.pending"
            ariaLabel="{{ vm.favoriteActionLabel }}: {{ title }}"
            [matTooltip]="vm.favoriteActionLabel"
            (onClick)="toggleFavorite()"
        >
            <i
                [class.fa-solid]="vm.isFavorite"
                [class.fa-regular]="!vm.isFavorite"
                class="icon fa-heart"
                aria-hidden="true"
            ></i>
        </app-icon-button>

        <app-icon-button
            class="action"
            [disabled]="vm.pending || listDialogPending()"
            ariaLabel="Add {{ title }} to one of your lists"
            matTooltip="Add to one of your lists"
            (onClick)="openCustomListsDialog()"
        >
            <i class="icon fa-solid fa-list" aria-hidden="true"></i>
        </app-icon-button>
    </div>
}
