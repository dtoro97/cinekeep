<div class="page-container">
    @if (vm$ | async; as vm) {
        <app-sub-page-header
            [backdropPath]="vm.media?.backdropPath"
            parentTitle="Reviews"
            [backLink]="['../']"
            [pageTitle]="vm.pageTitle"
        />

        <main class="page-main review-detail-layout">
            <aside class="review-detail-layout__summary">
                <app-review-media-summary [media]="vm.media" />
            </aside>

            <section class="review-detail-layout__body">
                @if (vm.reviewState.state === 'loading') {
                    <div class="review-detail-skeleton" aria-hidden="true">
                        <app-skeleton class="review-detail-skeleton__score" />
                        <div class="review-detail-skeleton__body">
                            <app-skeleton class="review-detail-skeleton__line review-detail-skeleton__line--byline" />
                            @for (line of skeletonLines; track $index) {
                                <app-skeleton class="review-detail-skeleton__line" />
                            }
                            <app-skeleton class="review-detail-skeleton__line review-detail-skeleton__line--short" />
                        </div>
                    </div>
                } @else if (vm.reviewState.state === 'success') {
                    @if (vm.reviewState.data; as review) {
                        <app-review-card [review]="review" variant="detail" />
                    } @else {
                        <app-empty-state iconClass="fa-regular fa-comment-dots" text="This review is unavailable." />
                    }
                }
            </section>
        </main>
    }
</div>
