<div class="media-list-dialog">
    <header class="media-list-dialog__header">
        <h2 class="text-display-sm">Add to a list</h2>
        <p class="text-body-sm media-list-dialog__subtitle">Choose a list for {{ data.title }}.</p>
    </header>

    <mat-dialog-content class="media-list-dialog__content">
        @if (hasLists) {
            <div class="media-list-dialog__list" role="listbox" aria-label="Your lists">
                @for (option of options; track option.list.id) {
                    @let list = option.list;
                    <button
                        class="media-list-dialog__list-item"
                        [class.media-list-dialog__list-item--present]="list.itemPresent"
                        type="button"
                        role="option"
                        [disabled]="list.itemPresent"
                        [attr.aria-selected]="list.itemPresent"
                        [attr.aria-label]="option.label"
                        (click)="selectList(list.id)"
                    >
                        <span class="media-list-dialog__thumb" aria-hidden="true">
                            <app-image [src]="list.posterPath" params="w92" />
                        </span>

                        <span class="media-list-dialog__copy">
                            <span class="media-list-dialog__heading">
                                <span class="media-list-dialog__name text-subtitle">{{ list.name }}</span>
                                <span class="media-list-dialog__count text-caption">
                                    {{ list.itemCount | pluralize: 'title' : 'titles' }}
                                </span>
                            </span>
                            @if (list.description) {
                                <span class="media-list-dialog__description text-body-sm">
                                    {{ list.description }}
                                </span>
                            }
                        </span>

                        @if (list.itemPresent) {
                            <span class="media-list-dialog__state media-list-dialog__state--added text-label">
                                <i class="fa-solid fa-check" aria-hidden="true"></i>
                                Added
                            </span>
                        } @else {
                            <span class="media-list-dialog__state text-label" aria-hidden="true">
                                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                                Add
                            </span>
                        }
                    </button>
                }
            </div>
        } @else {
            <div class="media-list-dialog__empty">
                <i class="media-list-dialog__empty-icon fa-solid fa-list" aria-hidden="true"></i>
                <p class="text-body-sm">You do not have any lists yet.</p>
            </div>
        }
    </mat-dialog-content>

    <mat-dialog-actions class="media-list-dialog__actions">
        @if (hasLists) {
            <button matButton="outlined" type="button" (click)="createList()">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                New list
            </button>
        } @else {
            <button matButton="filled" type="button" (click)="createList()">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                Create your first list
            </button>
        }

        <button matButton class="text-button" type="button" (click)="cancel()">Close</button>
    </mat-dialog-actions>
</div>
