<div class="media-list-dialog">
    <header class="media-list-dialog__header">
        <h2 class="media-list-dialog__title">Add to a list</h2>
        <p class="media-list-dialog__subtitle text-body">{{ presenceText }}</p>
    </header>

    <mat-dialog-content class="media-list-dialog__content">
        @if (hasLists) {
            <div class="media-list-dialog__list" role="listbox" aria-label="Your lists">
                @for (option of options; track option.list.id) {
                    @let list = option.list;
                    <button
                        class="media-list-dialog__list-item"
                        type="button"
                        role="option"
                        [disabled]="list.itemPresent"
                        [attr.aria-selected]="list.itemPresent"
                        [attr.aria-label]="option.label"
                        (click)="selectList(list.id)"
                    >
                        <span class="media-list-dialog__check" [class.media-list-dialog__check--on]="list.itemPresent" aria-hidden="true">
                            @if (list.itemPresent) {
                                <i class="fa-solid fa-check"></i>
                            }
                        </span>

                        <span class="media-list-dialog__thumb" aria-hidden="true">
                            <app-image [src]="list.posterPath" params="w92" />
                        </span>

                        <span class="media-list-dialog__copy">
                            <span class="media-list-dialog__name">{{ list.name }}</span>
                            <span class="media-list-dialog__count">{{ list.itemCount | pluralize: 'title' : 'titles' }}</span>
                        </span>
                    </button>
                }
            </div>
        } @else {
            <p class="media-list-dialog__empty text-body">You don't have any lists yet.</p>
        }

        <button class="media-list-dialog__create" matButton="outlined" type="button" (click)="createList()">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            {{ hasLists ? 'Create a new list' : 'Create your first list' }}
        </button>
    </mat-dialog-content>

    <mat-dialog-actions class="media-list-dialog__actions" align="end">
        <button matButton="outlined" type="button" (click)="cancel()">Close</button>
    </mat-dialog-actions>
</div>
