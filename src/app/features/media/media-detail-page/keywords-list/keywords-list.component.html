<ul class="keywords-list">
    @for (keyword of keywords; track keyword.id) {
        <li>
            <a
                class="keywords-list__keyword"
                [routerLink]="['/discover']"
                [queryParams]="{ type: mediaType, keywords: keyword.id }"
            >
                {{ keyword.name }}
            </a>
        </li>
    }
</ul>
