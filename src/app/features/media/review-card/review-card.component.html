@if (currentReview; as review) {
    <article class="review-card">
        <p class="review-card__score">
            @if (score) {
                <b class="review-card__figure">{{ score | number: '1.1-1' }}</b>
                <span class="review-card__scale">/ 10</span>
            }
        </p>

        <div class="review-card__main">
            <p class="review-card__byline">
                @if (reviewLink) {
                    <a class="review-card__author" [routerLink]="reviewLink">{{ author }}</a>
                } @else {
                    <span class="review-card__author">{{ author }}</span>
                }
                @if (review.created_at) {
                    <span class="review-card__date">{{ review.created_at | date: 'd MMM y' }}</span>
                }
            </p>

            <p class="review-card__content">{{ contentPreviewText }}</p>

            @if (reviewLink) {
                <a class="review-card__link" [routerLink]="reviewLink">Read full review ›</a>
            }
        </div>
    </article>
}
